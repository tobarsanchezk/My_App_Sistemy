<div id="login-wrapper">

    <!-- cajita de error de los terminos y condiciones (visual)-->
    <div id="terms-error-1" style="position: absolute; top: 5%; color: #FFFFFF; background-color: rgba(0, 0, 0, 0.6); border: 1px solid #000; padding: 8px 16px; border-radius: 6px; font-size: 15px; display: none; text-align: center; box-shadow: 0px 4px 8px rgba(0,0,0,0.3); z-index: 10;">
        Debes aceptar los términos y condiciones.
    </div> 

<!-- PANTALLA 1: Inicio / Selección -->
    <div id="screen-1" class="screen active">
        <h1>Inicia ahora</h1>
        <div style="display: flex; flex-direction: column; gap: 20px; justify-content: flex-start; padding-top: 50px; flex-grow: 1;">
            <button class="btn" onclick="switchScreen('screen-2')">Inicia sesion</button>
            <button class="btn" onclick="handleRegisterClick()">Registrarse</button>
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="terms">
            <label for="terms">Acepto los terminos y condiciones</label>
        </div>
    </div>

    <!-- Mensaje de error flotante externo para los Formularios -->
    <div id="form-error-msg" style="position: absolute; top: 7%; color: #FFFFFF; background-color: rgba(0, 0, 0, 0.6); border: 1px solid #000; padding: 8px 16px; border-radius: 6px; font-size: 15px; display: none; text-align: center; box-shadow: 0px 4px 8px rgba(0,0,0,0.3); z-index: 10;">
    <!-- Aquí aparecerá el texto del error dinámicamente -->
    </div>
    
<!-- PANTALLA 2: Datos de usuario (Inicio de sesión) -->
    <div id="screen-2" class="screen" style="justify-content: flex-start; gap: 10px;">
        <h1 style="margin-top: -17px; margin-bottom: 3px;">Inicia sesión</h1>

        <div style="display: flex; flex-direction: column; gap: 12px; margin: 0px 0;">
            <button class="btn" onclick="iniciarConGoogle()">Continúa con Google</button>
            <div style="text-align: center; font-size: 13px; color: #000; margin: 0px 0px -8px 0px; ">O con tu correo</div>

            <div class="form-group">
                <label style="font-size: 17px;">Corrreo electronico</label>
                <div class="input-container">
                    <input type="text" id="user-2" placeholder="Usuario_de_esta_app" style="padding: 12px 15px; font-size: 16px;">
                </div>
            </div>
            <div class="form-group">
                <label style="font-size: 17px;">Contraseña de usuario</label>
                <div class="input-container">
                    <input type="password" id="pass-2" placeholder="Contraseña_segura_12" style="padding: 12px 40px 12px 15px; font-size: 16px;">
                    <span class="toggle-password" onclick="togglePass(this)">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="#000000">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </span>
                </div>
            </div>
        </div>
        <div class="bottom-row" style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-text" style="font-size: 15px; margin-left: 25px; margin-bottom: 10px;" onclick="switchScreen('screen-5')">Recuperar cuenta</button>
            <button class="btn" style="width: 130px; padding: 6px 8px 8px 8px;" onclick="iniciarSesion()">Entrar</button>
        </div>
    </div>

    <!-- PANTALLA 3: Registro con Correo -->
    <div id="screen-3" class="screen" style="justify-content: flex-start; gap: 12px;">
        <h1 style="margin-top: -17px; margin-bottom: -3px;">Crea tu cuenta</h1>

        <div style="display: flex; flex-direction: column; gap: 10px; margin: 0px 0;">
            <div class="form-group">
                <label style="font-size: 17px;">Nombre de usuario</label>
                <div class="input-container">
                        <input type="text" id="name-3" placeholder="Tu alias en la app" style="padding: 12px 15px; font-size: 15px;">
                </div>
            </div>
            <div class="form-group">
                <label style="font-size: 17px;">Correo electrónico</label>
                <div class="input-container">
                    <input type="email" id="email-3" placeholder="tucorreo@ejemplo.com" style="padding: 12px 15px; font-size: 15px;">
                </div>
            </div>
            <div class="form-group">
                <label style="font-size: 17px;">Contraseña</label>
                <div class="input-container">
                    <input type="password" id="pass-3" placeholder="Mínimo 6 caracteres" style="padding: 12px 40px 12px 15px; font-size: 15px;">
                    <span class="toggle-password" onclick="togglePass(this)">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="#000000">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </span>
                </div>
            </div>
        </div>
        <div class="bottom-row" style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-text" style="font-size: 15px; margin-left: 60px;" onclick="switchScreen('screen-4')">Regresar</button>
            <button class="btn" style="width: 130px; padding: 6px 8px 8px 8px;" onclick="registrarUsuario()">Registrarme</button>
        </div>
    </div>


    <!-- PANTALLA 4: Regístrate (Opciones de Registro) -->
    <div id="screen-4" class="screen">
        <h1>Registrate</h1>
        <div style="display: flex; flex-direction: column; gap: 20px; justify-content: flex-start; padding-top: 55px; flex-grow: 1;">
            <button class="btn" onclick="iniciarConGoogle()">Continua con google</button>
            <button class="btn" onclick="switchScreen('screen-3')">Correo electronico</button>
        </div>
        <div class="checkbox-container">
            <input type="checkbox" checked disabled>
            <label>Acepto los terminos y condiciones</label>
        </div>
    </div>


    <!-- PANTALLA 5: Recuperar Cuenta -->
    <div id="screen-5" class="screen" style="justify-content: flex-start; gap: 20px;">
        <h1 style="margin-top: -5px; margin-bottom: 10px; font-size: 42px;">Recuperar cuenta</h1>


        <div style="display: flex; flex-direction: column; gap: 15px; margin: -10px 0 20px 0;">
            <div class="form-group">
                <label>Correo electrónico</label>
                <div class="input-container">
                    <input type="email" id="user-5" placeholder="tucorreo@ejemplo.com">
                </div>
            </div>
        </div>

        <p style="text-align: center; font-size: 18px; margin-bottom: 15px;">Ingresa aqui tu correo y te enviaremos un enlace para que puedas crear una nueva contraseña.</p>

        <div class="bottom-row" style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-text" onclick="switchScreen('screen-2')">Regresar a iniciar sesion</button>
            <button class="btn" style="width: 158px;" onclick="recuperarCuenta()">Enviar enlace</button>
        </div> 
    </div>
</div>

</body>
